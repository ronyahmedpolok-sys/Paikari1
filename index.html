<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাইকারি বিড | সরাসরি পাইকারি বাজার</title>
    
    <meta name="description" content="বাংলাদেশের প্রথম রিভার্স পাইকারি মার্কেটপ্লেস।">
    <meta property="og:title" content="পাইকারি বিড">
    <meta property="og:description" content="সরাসরি পাইকারি বাজারে কেনাবেচা করুন।">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    
    <style>
        :root { --primary: #1a73e8; --dark: #0d47a1; --success: #25d366; --bg: #f4f7fe; --footer-dark: #1c1c1c; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        .container { max-width: 500px; margin: auto; }
        
        .header { background: linear-gradient(135deg, var(--primary), var(--dark)); color: white; padding: 35px 20px; border-radius: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(26,115,232,0.3); contain: content; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; }

        .sticky-search { position: sticky; top: 0; z-index: 1000; background: var(--bg); padding: 10px 0; display: flex; gap: 5px; }
        .search-box { flex: 1; padding: 14px 18px; border: 2px solid transparent; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); outline: none; transition: border 0.3s; }
        .search-box:focus { border: 2px solid var(--primary); }
        .search-btn { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 0 15px; cursor: pointer; }

        .filter-box { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; -ms-overflow-style: none; }
        .filter-box::-webkit-scrollbar { display: none; }
        .filter-btn { background: white; border: none; padding: 10px 18px; border-radius: 12px; white-space: nowrap; cursor: pointer; font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,0.03); }
        .filter-btn.active { background: var(--primary); color: white; }

        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.04); margin-bottom: 25px; contain: content; }
        .form-control { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid #edf2f7; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .btn-post { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: opacity 0.2s; }
        .btn-post:active { opacity: 0.8; }

        .demand-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 20px; border: 1px solid #f0f0f0; position: relative; overflow: hidden; contain: content; }
        .demand-img { width: 100%; height: auto; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 10px; background: #f9f9f9; display: block; }
        .timer-badge { background: #fff5f5; color: #e53e3e; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        
        .bid-item { background: #f7fafc; border-radius: 12px; padding: 15px; margin-top: 10px; border-left: 4px solid var(--primary); position: relative; }
        .btn-deal-main { background: var(--success) !important; color: white !important; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 13px; display: inline-block; font-weight: 700; margin-top: 10px; }

        .sera-deal-badge { position: absolute; top: -5px; right: 10px; background: linear-gradient(45deg, #ff9800, #ff5722); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; box-shadow: 0 4px 10px rgba(255,152,0,0.4); animation: pulse 2s infinite; z-index: 5; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .share-btn { background: #eee; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 10px; color: #555; }
        .visitor-counter { background: white; padding: 15px; border-radius: 15px; text-align: center; margin-top: 30px; font-weight: bold; color: var(--primary); border: 1px solid #e0e0e0; display: none; }
        .admin-bar { display: none; background: #111; color: #fff; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .footer { background: var(--footer-dark); color: #999; padding: 40px 20px; margin-top: 20px; border-radius: 30px 30px 0 0; text-align: center; }
        .social-icons a { color: white; font-size: 22px; margin: 0 10px; text-decoration: none; }

        #admin-settings { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        #scrollToTop { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 45px; height: 45px; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer; z-index: 2000; border: none; }
    </style>
</head>
<body>

<button id="scrollToTop" aria-label="Scroll to top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fas fa-arrow-up"></i></button>

<div class="container">
    <header class="header">
        <h1>পাইকারি বিড</h1>
        <p>সরাসরি পাইকারি বাজারে কেনাবেচা করুন</p>
    </header>

    <div id="admin-info" class="admin-bar">🔒 এডমিন মোড একটিভ | <span onclick="logoutAdmin()" style="text-decoration:underline; cursor:pointer;">লগআউট</span></div>

    <div id="admin-settings" class="box">
        <h3 style="margin-top:0">⚙️ ফুটার সেটিংস</h3>
        <input type="text" id="setFb" class="form-control" placeholder="ফেসবুক লিঙ্ক">
        <input type="text" id="setYt" class="form-control" placeholder="ইউটিউব লিঙ্ক">
        <input type="text" id="setWa" class="form-control" placeholder="হোয়াটসঅ্যাপ নম্বর">
        <textarea id="setDesc" class="form-control" placeholder="ফুটার ডেসক্রিপশন"></textarea>
        <button class="btn-post" onclick="saveSettings()" style="background:#f39c12">সেটিংস সেভ করুন</button>
    </div>

    <div class="sticky-search">
        <input type="text" id="searchInput" class="search-box" placeholder="পণ্যের নাম বা নম্বর..." onkeyup="debouncedRender()">
        <button class="search-btn" onclick="scrollToResults()">🔍</button>
    </div>

    <nav class="filter-box" id="filterContainer">
        <button class="filter-btn active" onclick="filterCat('সব', this)">🌐 সব</button>
        <button class="filter-btn" onclick="filterCat('খাদ্য', this)">🍚 খাদ্য</button>
        <button class="filter-btn" onclick="filterCat('বস্ত্র', this)">👕 বস্ত্র</button>
        <button class="filter-btn" onclick="filterCat('শিক্ষা', this)">📚 শিক্ষা</button>
        <button class="filter-btn" onclick="filterCat('চিকিৎসা', this)">💊 চিকিৎসা</button>
        <button class="filter-btn" onclick="filterCat('কসমেটিকস', this)">💄 কসমেটিকস</button>
        <button class="filter-btn" onclick="filterCat('ইলেকট্রনিক্স', this)">🔌 ইলেকট্রনিক্স</button>
        <button class="filter-btn" onclick="filterCat('অন্যান্য', this)">📦 অন্যান্য</button>
    </nav>

    <div id="admin-tabs-ctrl" style="display:none; gap: 8px; margin-bottom: 20px;">
        <button class="filter-btn active" style="flex:1" onclick="switchAdminTab('pending', this)">পেন্ডিং</button>
        <button class="filter-btn" style="flex:1" onclick="switchAdminTab('approved', this)">লাইভ</button>
    </div>

    <section class="box" id="post-form-sec">
        <h2>নতুন চাহিদা পোস্ট করুন</h2>
        <select id="cat" class="form-control">
            <option value="খাদ্য">খাদ্য ও মনিহারি</option>
            <option value="বস্ত্র">পোশাক ও বস্ত্র</option>
            <option value="শিক্ষা">শিক্ষা উপকরণ</option>
            <option value="চিকিৎসা">চিকিৎসা</option>
            <option value="কসমেটিকস">কসমেটিকস</option>
            <option value="ইলেকট্রনিক্স">ইলেকট্রনিক্স</option>
            <option value="অন্যান্য">অন্যান্য</option>
        </select>
        <input type="text" id="pName" class="form-control" placeholder="পণ্যের নাম">
        <input type="text" id="pQty" class="form-control" placeholder="পরিমাণ">
        <textarea id="pDetails" class="form-control" rows="2" placeholder="বিস্তারিত"></textarea>
        <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">পণ্যের ছবি (ঐচ্ছিক):</label>
        <input type="file" id="pImage" class="form-control" accept="image/*">
        <button class="btn-post" id="submitBtn" onclick="uploadAndPost()">পোস্ট সাবমিট</button>
        <p id="pendingMsg" style="display:none; color:#e67e22; font-weight:bold; text-align:center; margin-top:10px;">আপনার পোস্টটি এডমিন অ্যাপ্রুভালের অপেক্ষায় আছে।</p>
        <p onclick="loginAdmin()" style="text-align:center; font-size:10px; color:#ccc; margin-top:20px; cursor:pointer;">STAFF LOGIN</p>
    </section>

    <div id="result-anchor"></div>
    <main id="demand-list">লোড হচ্ছে...</main>

    <div class="visitor-counter" id="vBox">
        <i class="fas fa-eye"></i> ভিজিটর: <span id="vCount">০</span>
    </div>

    <footer class="footer">
        <h3>পাইকারি বিড</h3>
        <p id="footer-text-display" style="font-size: 14px; color: #bbb; padding: 0 10px;"></p>
        <div class="social-icons">
            <a href="#" id="fb-link" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" id="yt-link" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" id="wa-link" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <span style="font-size:11px;">© 2015 - 2026 PaikariBid®</span>
    </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCFuAqWulUbrZxXElNK0L8m0bod-aEYaSs",
    authDomain: "paikari-3cfbc.firebaseapp.com",
    databaseURL: "https://paikari-3cfbc-default-rtdb.firebaseio.com",
    projectId: "paikari-3cfbc",
    storageBucket: "paikari-3cfbc.firebasestorage.app",
    messagingSenderId: "474039383315",
    appId: "1:474039383315:web:0b7cc4a9d1bbf0757696e6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  let adminMode = false;
  let adminCurrentTab = 'approved';
  let currentFilter = 'সব';
  let currentWaNumber = "8801576699828";
  let renderTimeout;

  auth.onAuthStateChanged((user) => {
      if (user && user.email === "irbadhon1@gmail.com") {
          adminMode = true;
          document.getElementById('admin-info').style.display = 'block';
          document.getElementById('admin-tabs-ctrl').style.display = 'flex';
          document.getElementById('vBox').style.display = 'block';
          document.getElementById('admin-settings').style.display = 'block';
          adminCurrentTab = 'pending';
      } else {
          adminMode = false;
      }
      render();
  });

  function loginAdmin() {
      const email = prompt("ইমেইল:");
      const pass = prompt("পাসওয়ার্ড:");
      if(email && pass) auth.signInWithEmailAndPassword(email, pass).catch(e => alert("ভুল তথ্য!"));
  }
  function logoutAdmin() { auth.signOut().then(() => location.reload()); }

  function debouncedRender() {
      clearTimeout(renderTimeout);
      renderTimeout = setTimeout(() => render(), 300);
  }

  // ডেটা সেনিটাইজেশন: ইউজার এডমিন না হলে কনসোল থেকে ফোন নম্বর হাইড করা
  function getSanitizedData() {
      if (adminMode) return window.currentData || {};
      const rawData = JSON.parse(JSON.stringify(window.currentData || {}));
      Object.keys(rawData).forEach(postId => {
          if (rawData[postId].all_bids) {
              Object.keys(rawData[postId].all_bids).forEach(bidId => {
                  delete rawData[postId].all_bids[bidId].b_phone;
              });
          }
      });
      return rawData;
  }

  function render() {
      const area = document.getElementById('demand-list');
      const query = document.getElementById('searchInput').value.toLowerCase();
      const data = getSanitizedData(); 
      const keys = Object.keys(data).reverse();
      let finalHTML = ""; 

      keys.forEach(id => {
          const v = data[id];
          let phoneFound = false;
          if(adminMode && v.all_bids) {
              phoneFound = Object.values(v.all_bids).some(b => b.b_phone && b.b_phone.includes(query));
          }

          if(!adminMode && v.status !== 'approved') return;
          if(adminMode && v.status !== adminCurrentTab) return;
          if(currentFilter !== 'সব' && v.cat !== currentFilter) return;
          if(query && !v.name.toLowerCase().includes(query) && !phoneFound) return;

          let minBidPrice = Infinity;
          if(v.all_bids) {
              Object.values(v.all_bids).forEach(b => {
                  let p = parseFloat(b.b_price);
                  if(!isNaN(p) && p < minBidPrice) minBidPrice = p;
              });
          }

          let bidsHTML = "";
          if(v.all_bids) {
              Object.values(v.all_bids).forEach(b => {
                  const isSeraDeal = parseFloat(b.b_price) === minBidPrice && minBidPrice !== Infinity;
                  const professionalMsg = encodeURIComponent(`*নতুন ডিল কনফার্মেশন*\n\n📦 *পণ্য:* ${v.name}\n⚖️ *পরিমাণ:* ${v.qty}\n💰 *অফার:* ${b.b_price}৳\n👤 *বিক্রেতা:* ${b.b_name}\n\nপাইকারি বিড থেকে এই ডিলটি নিয়ে কথা বলতে চাই।`);
                  let bidderContactInfo = adminMode ? `<div style="color:red; font-size:13px; font-weight:bold; margin-top:5px;">📞 ${b.b_phone}</div>` : '';

                  bidsHTML += `
                    <div class="bid-item" style="${isSeraDeal ? 'border-left: 4px solid #ff9800; background: #fffdf5;' : ''}">
                        ${isSeraDeal ? `<span class="sera-deal-badge"><i class="fas fa-crown"></i> সেরা ডিল</span>` : ''}
                        <b>👤 ${b.b_name}</b> <span style="float:right;">${b.b_price}৳</span>
                        ${bidderContactInfo}
                        <div style="text-align:right">
                            <a href="https://wa.me/${currentWaNumber}?text=${professionalMsg}" class="btn-deal-main" target="_blank">ডিল করুন</a>
                        </div>
                    </div>`;
              });
          }

          finalHTML += `
            <div class="demand-card">
                <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:var(--primary)">
                    <span>${v.cat}</span>
                    <span class="timer-badge" data-start="${v.createdAt}">⌛ লোড হচ্ছে...</span>
                </div>
                ${v.img ? `<img src="${v.img}" class="demand-img" loading="lazy" alt="${v.name}">` : ''}
                <h3 style="margin: 5px 0;">${v.name}</h3>
                <p style="margin: 0 0 10px 0;">পরিমাণ: <b>${v.qty}</b></p>
                <button class="share-btn" onclick="sharePost('${v.name.replace(/'/g, "\\'")}', '${v.qty.replace(/'/g, "\\'")}')">
                    <i class="fas fa-share-alt"></i> শেয়ার
                </button>
                <div class="bid-section">
                    ${bidsHTML || '<p style="text-align:center; color:#999; font-size:12px;">কোনো অফার নেই</p>'}
                    <div style="margin-top:15px; background:#f0f4f8; padding:15px; border-radius:15px;">
                        <input type="text" id="n-${id}" placeholder="নাম" class="form-control">
                        <input type="number" id="p-${id}" placeholder="দাম" class="form-control">
                        <input type="number" id="h-${id}" placeholder="মোবাইল" class="form-control">
                        <button onclick="sendBid('${id}')" class="btn-post">অফার দিন</button>
                    </div>
                </div>
                ${adminMode ? `<div style="margin-top:10px; display:flex; gap:5px;"><button onclick="appr('${id}')" style="flex:1; border:none; padding:8px; border-radius:5px; background:#2ecc71; color:white;">Approve</button> <button onclick="del('${id}')" style="flex:1; border:none; padding:8px; border-radius:5px; background:#e74c3c; color:white;">Delete</button></div>` : ''}
            </div>`;
      });
      area.innerHTML = finalHTML || "<p style='text-align:center; padding:20px;'>কোনো চাহিদা পাওয়া যায়নি</p>";
  }

  function sharePost(name, qty) {
      const shareText = `📢 *পাইকারি বিড-এ নতুন চাহিদা!*\n📦 পণ্য: *${name}*\n⚖️ পরিমাণ: *${qty}*\n\nভিজিট করুন: `;
      const shareUrl = window.location.href;
      if (navigator.share) {
          navigator.share({ title: 'পাইকারি বিড', text: shareText, url: shareUrl });
      } else {
          window.open(`https://wa.me/?text=${encodeURIComponent(shareText + shareUrl)}`, '_blank');
      }
  }

  async function uploadAndPost() {
      const n = document.getElementById('pName').value, q = document.getElementById('pQty').value, c = document.getElementById('cat').value, d = document.getElementById('pDetails').value, imgInput = document.getElementById('pImage');
      const btn = document.getElementById('submitBtn');
      if(!n || !q) return alert("তথ্য অসম্পূর্ণ!");
      btn.innerText = "প্রসেসিং..."; btn.disabled = true;
      let imgUrl = "";
      if(imgInput.files[0]) {
          const formData = new FormData();
          formData.append("image", imgInput.files[0]);
          try {
              const res = await fetch("https://api.imgbb.com/1/upload?key=11a7ab5f6de801d39a4b830d1a709e0d", { method: "POST", body: formData });
              const result = await res.json();
              if(result.success) imgUrl = result.data.url;
          } catch(e) { console.error("Upload failed"); }
      }
      db.ref('posts').push({
          name: n, qty: q, cat: c, det: d, img: imgUrl, status: 'pending', createdAt: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
          document.getElementById('pendingMsg').style.display = 'block';
          setTimeout(() => location.reload(), 2000);
      });
  }

  db.ref('posts').on('value', snap => { window.currentData = snap.val(); render(); });
  
  function sendBid(id) {
      const n = document.getElementById('n-'+id).value, p = document.getElementById('p-'+id).value, h = document.getElementById('h-'+id).value;
      if(!n || !p || h.length !== 11) return alert("সঠিক মোবাইল নম্বর দিন!");
      db.ref('posts/'+id+'/all_bids').push({b_name:n, b_price:p, b_phone:h}).then(() => alert("অফার পাঠানো হয়েছে!"));
  }

  db.ref('siteSettings').on('value', snap => {
      const s = snap.val() || {};
      currentWaNumber = s.wa || "8801576699828";
      document.getElementById('footer-text-display').innerText = s.desc || "বাংলাদেশের প্রথম রিভার্স পাইকারি মার্কেটপ্লেস।";
      document.getElementById('fb-link').href = s.fb || "#";
      document.getElementById('yt-link').href = s.yt || "#";
      document.getElementById('wa-link').href = "https://wa.me/" + currentWaNumber;
  });

  function saveSettings() {
      db.ref('siteSettings').update({
          fb: document.getElementById('setFb').value, yt: document.getElementById('setYt').value, wa: document.getElementById('setWa').value, desc: document.getElementById('setDesc').value
      }).then(() => alert("সেভ হয়েছে!"));
  }

  function filterCat(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('#filterContainer .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
      if(cat !== 'সব') scrollToResults();
  }

  function switchAdminTab(t, btn) {
      adminCurrentTab = t;
      document.querySelectorAll('#admin-tabs-ctrl .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
  }

  function appr(id) { db.ref('posts/'+id).update({status:'approved'}); }
  function del(id) { if(confirm("মুছবেন?")) db.ref('posts/'+id).remove(); }
  function scrollToResults() { document.getElementById('result-anchor').scrollIntoView({ behavior: 'smooth' }); }

  db.ref('visitorCount').transaction(c => (c || 0) + 1);
  db.ref('visitorCount').on('value', s => { document.getElementById('vCount').innerText = s.val() || 0; });

  let scrollThrottle;
  window.addEventListener('scroll', () => {
      if (!scrollThrottle) {
          window.requestAnimationFrame(() => {
              document.getElementById("scrollToTop").style.display = window.pageYOffset > 400 ? "flex" : "none";
              scrollThrottle = false;
          });
          scrollThrottle = true;
      }
  });

  setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('.timer-badge').forEach(el => {
          const start = parseInt(el.getAttribute('data-start'));
          if(isNaN(start)) return;
          const diff = 172800000 - (now - start);
          if(diff <= 0) el.innerText = "⌛ সময় শেষ";
          else {
              const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
              el.innerText = `⌛ ${h}ঘ : ${m}মি বাকি`;
          }
      });
  }, 10000);
</script>
</body>
</html>
